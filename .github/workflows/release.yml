name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build HACS zip
        run: |
          mkdir -p dist
          zip -r dist/growatt_modbus.zip custom_components/growatt_modbus

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/growatt_modbus.zip

# --- Battery pack / BMS data (WIT protocol, input registers 3212-3232) ---
- name: BMS Status
  unique_id: bms_status
  register_type: input
  address: 3212
  count: 1
  scale: 1.0
  options:
    0: dormancy
    1: charge
    2: discharge
    3: free
    4: standby
    5: soft start
    6: fault
    7: update

- name: BMS SOC
  unique_id: bms_soc
  register_type: input
  address: 3215
  count: 1
  scale: 1.0
  unit_of_measurement: '%'
  device_class: battery
  state_class: measurement
  signed: false

- name: BMS Battery Voltage
  unique_id: bms_battery_voltage
  register_type: input
  address: 3216
  count: 1
  scale: 0.01
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: BMS Battery Current
  unique_id: bms_battery_current
  register_type: input
  address: 3217
  count: 1
  scale: 0.01
  unit_of_measurement: A
  device_class: current
  state_class: measurement
  signed: true

- name: BMS Battery Temperature
  unique_id: bms_battery_temperature
  register_type: input
  address: 3218
  count: 1
  scale: 0.1
  unit_of_measurement: "\xB0C"
  device_class: temperature
  state_class: measurement
  signed: true

- name: BMS Max Charge Current
  unique_id: bms_max_charge_current

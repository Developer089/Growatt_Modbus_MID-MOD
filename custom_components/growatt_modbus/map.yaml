# --- Battery pack / BMS data (WIT protocol, input registers 3212-3232) ---
- name: BMS Status
  unique_id: bms_status
  register_type: input
  address: 3212
  count: 1
  scale: 1.0
  options:
    0: dormancy
    1: charge
    2: discharge
    3: free
    4: standby
    5: soft start
    6: fault
    7: update

- name: BMS SOC
  unique_id: bms_soc
  register_type: input
  address: 3215
  count: 1
  scale: 1.0
  unit_of_measurement: '%'
  device_class: battery
  state_class: measurement
  signed: false

- name: BMS Battery Voltage
  unique_id: bms_battery_voltage
  register_type: input
  address: 3216
  count: 1
  scale: 0.01
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: BMS Battery Current
  unique_id: bms_battery_current
  register_type: input
  address: 3217
  count: 1
  scale: 0.01
  unit_of_measurement: A
  device_class: current
  state_class: measurement
  signed: true

- name: BMS Battery Temperature
  unique_id: bms_battery_temperature
  register_type: input
  address: 3218
  count: 1
  scale: 0.1
  unit_of_measurement: "\xB0C"
  device_class: temperature
  state_class: measurement
  signed: true

- name: BMS Max Charge Current
  unique_id: bms_max_charge_current
  register_type: input
  address: 3219
  count: 1
  scale: 0.01
  unit_of_measurement: A
  device_class: current
  state_class: measurement
  signed: false

- name: BMS Max Discharge Current
  unique_id: bms_max_discharge_current
  register_type: input
  address: 3220
  count: 1
  scale: 0.01
  unit_of_measurement: A
  device_class: current
  state_class: measurement
  signed: false

- name: BMS Cycle Count
  unique_id: bms_cycle_count
  register_type: input
  address: 3221
  count: 1
  scale: 1.0
  state_class: total_increasing
  signed: false

- name: BMS State Of Health
  unique_id: bms_soh
  register_type: input
  address: 3222
  count: 1
  scale: 1.0
  unit_of_measurement: '%'
  state_class: measurement
  signed: false

- name: BMS Charge Voltage Limit
  unique_id: bms_charge_voltage_limit
  register_type: input
  address: 3223
  count: 1
  scale: 0.01
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: BMS Discharge Voltage Limit
  unique_id: bms_discharge_voltage_limit
  register_type: input
  address: 3225
  count: 1
  scale: 0.01
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: BMS Cell Voltage Max
  unique_id: bms_cell_voltage_max
  register_type: input
  address: 3230
  count: 1
  scale: 0.001
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: BMS Cell Voltage Min
  unique_id: bms_cell_voltage_min
  register_type: input
  address: 3231
  count: 1
  scale: 0.001
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false

- name: Battery Load Voltage
  unique_id: battery_load_voltage
  register_type: input
  address: 3232
  count: 1
  scale: 0.01
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  signed: false


- name: Work Mode
  unique_id: work_mode_sensor
  register_type: input    # nebo holding – podle reálné adresy v manuálu
  address: 118            # potvrď, že 118 je správně pro Work Mode
  count: 1
  scale: 1


  
controls:
- type: switch
  name: "Grid Charge"
  unique_id: grid_charge
  register_type: holding
  address: 3049
  on_value: 1
  off_value: 0
  optimistic: true
  
- type: number
  name: "Export Power Rate"
  unique_id: export_power_rate
  register_type: holding
  address: 123
  min: -100
  max: 100
  step: 0.1
  unit_of_measurement: "%"
  mode: slider
  optimistic: true
  write_factor: 10
  signed: true
  entity_category: config

- type: number
  name: "Battery Charge Power"
  unique_id: battery_charge_power
  register_type: holding
  address: 3047        
  min: 0
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: slider
  optimistic: true
  write_factor: 1
  
- type: number
  name: "Battery Discharge Power"
  unique_id: battery_discharge_power
  register_type: holding
  address: 3036        
  min: 0
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: slider
  optimistic: true
  write_factor: 1

- type: select32
  name: "Period Mode"
  unique_id: WorkMode
  base_address: 3038       # adresa začátku 32-bitového registru (high word)
  word_order: low_high     # pořadí slov: high_low nebo low_high
  options:
    - label: "Load priority"
      value: 389775360
    - label: "Battery priority"
      value: 389783552
    - label: "Grid priority"
      value: 389791744


  
